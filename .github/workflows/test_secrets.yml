name: Test Secrets

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check available secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: |
          echo "=== Проверка секретов ==="
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then echo "✅ TELEGRAM_BOT_TOKEN: найден"; else echo "❌ TELEGRAM_BOT_TOKEN: НЕ НАЙДЕН"; fi
          if [ -n "$CHANNEL_ID" ]; then echo "✅ CHANNEL_ID: найден"; else echo "❌ CHANNEL_ID: НЕ НАЙДЕН"; fi
          if [ -n "$OPENROUTER_API_KEY" ]; then echo "✅ OPENROUTER_API_KEY: найден"; else echo "❌ OPENROUTER_API_KEY: НЕ НАЙДЕН"; fi
          if [ -n "$HF_API_TOKEN" ]; then echo "✅ HF_API_TOKEN: найден"; else echo "❌ HF_API_TOKEN: НЕ НАЙДЕН"; fi
          echo "=== Конец проверки ==="
